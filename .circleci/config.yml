version: 2.1

orbs:
  # Orbs are packaged, versioned recipes. Pinning them is deliberate: an
  # unpinned orb changes under you and turns a reproducible pipeline into a
  # moving target. If CircleCI reports a version does not exist, config
  # validation fails before any job runs, which is the cheap failure.
  node: circleci/node@5.0.2
  eb: circleci/aws-elastic-beanstalk@2.0.1
  aws-cli: circleci/aws-cli@3.1.1

jobs:
  # ---------------------------------------------------------------------
  # build — runs on every push, on every branch.
  #
  # Its job is to answer one question: is this commit safe to ship? It
  # installs both halves, lints, runs the unit tests, and compiles both
  # applications. Any step exiting non-zero stops the rest, so the first
  # real problem is the one you read about.
  # ---------------------------------------------------------------------
  build:
    docker:
      # Node 14 matches the version the application was written against.
      # scripts/node-compat.js makes the build work on newer majors too, so
      # this image can be raised later without editing any command.
      - image: "cimg/node:14.15-browsers"
    steps:
      - node/install:
          node-version: '14.15'
      - checkout

      # Dependencies first, both halves. npm install resolves from
      # package.json; the root scripts delegate into each sub-project so
      # that CI runs exactly the commands a person runs locally.
      - run:
          name: Install Front-End Dependencies
          command: |
            echo "node $(node --version), npm $(npm --version)"
            npm run frontend:install

      # The API has its own package.json and its own dependency tree. The
      # frontend install does not reach it.
      - run:
          name: Install API Dependencies
          command: |
            npm run api:install

      # Lint before building. Style and correctness problems are cheaper to
      # read as lint output than as a failed compile, and tslint catches
      # things the compiler is happy to accept.
      - run:
          name: Front-End Lint
          command: |
            npm run frontend:lint

      # Unit tests, headless and single-shot. karma.conf.js uses
      # ChromeHeadlessNoSandbox because a CI container has no display and no
      # sandbox privileges, and singleRun is true because a watcher would
      # never exit and the job would hang until the platform timeout.
      - run:
          name: Locate Chrome for karma
          command: |
            # karma-chrome-launcher looks for $CHROME_BIN first, then for a
            # handful of binary names on PATH. The -browsers image has
            # Chrome, but which name it installs has changed between image
            # generations, and when the lookup fails karma reports "No
            # binary for ChromeHeadless browser on your platform" -- which
            # reads as a test failure rather than a missing browser.
            #
            # This finds it and says so, or fails HERE with the evidence
            # needed to tell "Chrome is missing" from "Chrome is somewhere
            # else". An ambiguous failure two steps later costs far more
            # than this step does.
            BIN="$(command -v google-chrome \
                  || command -v google-chrome-stable \
                  || command -v chromium \
                  || command -v chromium-browser \
                  || true)"
            if [ -z "$BIN" ]; then
              echo "No Chrome on this image. Evidence follows." >&2
              echo "--- image ---" >&2; cat /etc/os-release 2>&1 | head -2 >&2
              echo "--- PATH ---" >&2; echo "$PATH" >&2
              echo "--- anything chrome-shaped ---" >&2
              ls -la /usr/bin /opt 2>/dev/null | grep -i chrom >&2 || \
                echo "(nothing)" >&2
              exit 1
            fi
            echo "export CHROME_BIN=$BIN" >> "$BASH_ENV"
            echo "CHROME_BIN=$BIN"
            "$BIN" --version
      - run:
          name: Front-End Unit Tests
          command: |
            npm test

      # Production build: ahead-of-time compilation, minification and
      # content-hashed bundle names, with no source maps. This is the
      # artifact a user would receive, so it is the artifact that must
      # compile here rather than for the first time during a deploy.
      - run:
          name: Front-End Build
          command: |
            npm run frontend:build

      # The API is TypeScript and must be transpiled to JavaScript before it
      # can run on the server. Building it here means a type error fails the
      # pipeline rather than the deployment.
      - run:
          name: API Build
          command: |
            npm run api:build

  # ---------------------------------------------------------------------
  # deploy — runs only on main, and only after a human approves the hold.
  #
  # It installs, builds and ships both halves, as the project instructions
  # require. The trade-off that creates is recorded in
  # docs/Pipeline_description.md rather than left implicit here.
  # ---------------------------------------------------------------------
  deploy:
    docker:
      - image: "cimg/base:stable"
    steps:
      - node/install:
          node-version: '14.15'
      # eb/setup installs the Elastic Beanstalk CLI; aws-cli/setup
      # configures credentials from the project's environment variables.
      # Both read AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and
      # AWS_DEFAULT_REGION, which are set in CircleCI project settings and
      # never committed.
      - eb/setup
      - aws-cli/setup
      - checkout

      # A fresh container: nothing from the build job survives into this
      # one, so both dependency trees are installed again here.
      - run:
          name: Install Dependencies
          command: |
            npm run frontend:install
            npm run api:install

      # Compile both halves for production. The instructions require the
      # deploy job to build, so this is a second compile of the same commit
      # the build job already proved; Pipeline_description.md records what
      # that costs and why it is done this way.
      - run:
          name: Build Both Applications
          command: |
            npm run build

      # Ship it. The frontend syncs its built output to the S3 website
      # bucket; the API is packaged and handed to Elastic Beanstalk, which
      # rolls the new version onto the environment.
      - run:
          name: Deploy Both Applications
          command: |
            npm run deploy

workflows:
  udagram:
    jobs:
      # Every branch builds. A pull request that cannot build is visible
      # before anyone reviews it.
      - build

      # The approval gate. Nothing reaches AWS without a person choosing it,
      # and the filter means that choice only ever appears on main.
      - hold:
          filters:
            branches:
              only:
                - main
          type: approval
          requires:
            - build

      # Deploy carries the same filter as the gate it waits on. Relying on
      # the dependency alone would mean the filter lives in one place and the
      # job it protects in another, which is a difference nobody notices
      # until a branch name changes.
      - deploy:
          filters:
            branches:
              only:
                - main
          requires:
            - hold
