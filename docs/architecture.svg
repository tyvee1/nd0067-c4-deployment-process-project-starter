<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Infrastructure: a browser loads the frontend from S3 and calls the Elastic Beanstalk API, which reads RDS PostgreSQL.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#44506b"/></marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d6b76"/></marker>
  </defs>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#141921">Udagram — deployed infrastructure</text>

  <rect x="24" y="62" width="150" height="66" rx="8" fill="#eef1f5" stroke="#44506b" stroke-width="1.5"/>
  <text x="99" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#141921">User browser</text>
  <text x="99" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">outside AWS</text>

  <path d="M174 82 H300" stroke="#44506b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="237" y="74" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">1. GET / (static files)</text>

  <rect x="300" y="52" width="190" height="76" rx="8" fill="#e0f0f1" stroke="#0d6b76" stroke-width="1.8"/>
  <text x="395" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#141921">AWS S3</text>
  <text x="395" y="99" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">static website hosting</text>
  <text x="395" y="116" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">Front-End (Angular bundle)</text>

  <path d="M99 128 V250 H300" stroke="#44506b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="112" y="200" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">2. XHR to the API URL</text>
  <text x="112" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">compiled into the bundle</text>

  <rect x="24" y="300" width="672" height="100" rx="10" fill="none" stroke="#9aa5b4" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="40" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#56616f">AWS — not reachable from the browser</text>

  <rect x="300" y="218" width="190" height="76" rx="8" fill="#e0f0f1" stroke="#0d6b76" stroke-width="1.8"/>
  <text x="395" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#141921">AWS Elastic Beanstalk</text>
  <text x="395" y="265" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">Node / Express — the API</text>
  <text x="395" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">EC2 + load balancer</text>

  <path d="M395 294 V340 H506" stroke="#0d6b76" stroke-width="1.8" fill="none" marker-end="url(#arrowc)"/>
  <text x="404" y="332" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">3. port 5432, security group to security group</text>

  <rect x="506" y="312" width="174" height="72" rx="8" fill="#eef1f5" stroke="#44506b" stroke-width="1.5"/>
  <text x="593" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#141921">AWS RDS</text>
  <text x="593" y="359" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">PostgreSQL — the DB</text>
  <text x="593" y="375" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">users, feed items</text>

  <rect x="506" y="52" width="174" height="76" rx="8" fill="#eef1f5" stroke="#44506b" stroke-width="1.5"/>
  <text x="593" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#141921">AWS S3 — media</text>
  <text x="593" y="99" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">private bucket</text>
  <text x="593" y="116" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">pre-signed URLs only</text>
  <path d="M490 90 H506" stroke="#44506b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M470 218 V150 H560 V128" stroke="#0d6b76" stroke-width="1.6" fill="none" marker-end="url(#arrowc)" stroke-dasharray="4 4"/>
  <text x="478" y="172" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#56616f">4. API signs upload URLs</text>
</svg>
